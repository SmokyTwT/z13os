# Installateur Anaconda : tu choisis le disque et le fuseau horaire, et tu crées ton compte
# (depuis la refonte du 24/11, l'image n'a plus d'assistant de premier démarrage : sans l'étape
# « Création de l'utilisateur », une installation neuve n'aurait aucun compte pour se connecter).
# @IMAGE@ est remplacé par le workflow.
[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry @IMAGE@
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Subscription"
]
