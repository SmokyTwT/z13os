    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="46">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b4b4be"/>
