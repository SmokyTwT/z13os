<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2f"/><stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9b9c2"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity=".4"/></filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="12.5" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="4" y="4" width="56" height="56" rx="12.5" fill="url(#glow)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="12" fill="none" stroke="#fff" stroke-opacity=".16"/>
  <rect x="20" y="49" width="24" height="2.2" rx="1.1" fill="#3b82ff" filter="url(#blur)" opacity=".9"/>
  <rect x="22" y="49.4" width="20" height="1.4" rx=".7" fill="#3b82ff"/>
  <text x="32" y="37" text-anchor="middle" font-family="Inter, Adwaita Sans, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="18" fill="#fff" opacity=".35" filter="url(#blur)">TF1+</text>
  <text x="32" y="37" text-anchor="middle" font-family="Inter, Adwaita Sans, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="18" fill="url(#ink)" letter-spacing="-.5">TF1+</text>
</svg>
