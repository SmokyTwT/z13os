<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2f"/><stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9b9c2"/>
    </linearGradient>
    <linearGradient id="smk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity=".4"/></filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="12.5" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="4" y="4" width="56" height="56" rx="12.5" fill="url(#glow)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="12" fill="none" stroke="#fff" stroke-opacity=".16"/>
  <!-- trait d'écriture lumineux qui se termine en volute -->
  <path d="M14 44 C 20 30, 24 30, 26 38 S 32 46, 36 36 S 42 22, 46 26 C 50 29, 47 34, 44 32 C 41 30, 44 24, 49 20" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" opacity=".45" filter="url(#blur)"/>
  <path d="M14 44 C 20 30, 24 30, 26 38 S 32 46, 36 36 S 42 22, 46 26 C 50 29, 47 34, 44 32 C 41 30, 44 24, 49 20" fill="none" stroke="url(#ink)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M49 20 C 51 16, 48 13, 51 10" fill="none" stroke="url(#smk)" stroke-width="1.8" stroke-linecap="round"/>
</svg>
