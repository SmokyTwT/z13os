# Smoky OS — énergie : moins de réveils du processeur au repos, sans effet visible à l'usage
# (mêmes réglages que le profil « économie » de Fedora, appliqués tout le temps).
# Pas de chien de garde NMI : il détecte les blocages complets du noyau en réveillant le
# processeur régulièrement ; inutile sur un PC portable personnel.
kernel.nmi_watchdog = 0
# Les fichiers modifiés partent sur le disque toutes les 15 s au lieu de 5 s.
vm.dirty_writeback_centisecs = 1500
