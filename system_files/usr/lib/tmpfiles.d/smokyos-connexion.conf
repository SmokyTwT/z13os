# Smoky OS — dossier de l'écran de connexion (compte greetd). Sur un système à image, /var n'est
# rempli qu'à l'installation : il est donc créé ici. Il reçoit la demande du bouton « Windows »,
# retirée à chaque démarrage pour qu'une vieille demande ne relance jamais Windows.
d /var/lib/greetd 0750 greetd greetd -
r /var/lib/greetd/smoky-windows
