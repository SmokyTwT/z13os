# Smoky OS : Fedora refait l'index des pages de manuel (mandb) à CHAQUE démarrage, alors que cela ne
# sert qu'après un changement d'image. On ne le lance donc qu'une fois par image
# (/usr/libexec/smokyos/une-fois-par-image.sh). Dans le doute, il tourne comme avant.
[Service]
ExecCondition=/usr/libexec/smokyos/une-fois-par-image.sh mandb
ExecStartPost=/usr/libexec/smokyos/une-fois-par-image.sh mandb fait
