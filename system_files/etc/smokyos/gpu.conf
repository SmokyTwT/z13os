# Smoky OS — carte graphique et double démarrage avec Windows
# (lu par /usr/libexec/smokyos/smokygpu.py ; pris en compte au prochain démarrage)
#
# Le mode « Ultimate » d'Armoury Crate relie l'écran directement à la carte NVIDIA. Ce réglage
# est gardé par le firmware du PC : il reste en place quand on redémarre sur Smoky OS.

# Au démarrage de Smoky OS, si l'écran est relié à la NVIDIA : le rendre à la puce Intel et
# redémarrer une fois, automatiquement.   oui | non
intel_auto=oui

# En repartant sur Windows par « Redémarrer sur Windows » (Smoky Center) : remettre le mode Ultimate.
#   auto : seulement si Windows l'avait déjà mis (Smoky OS l'a constaté au moins une fois)
#   oui  : toujours        non : jamais
windows_ultimate=auto
