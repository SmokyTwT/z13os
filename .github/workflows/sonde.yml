name: sonde
# Sonde temporaire (branche « sonde » seulement) : que contient Fedora 44 bootc, quels paquets
# existent pour le bureau Smoky refait. Ne construit ni ne publie rien.
on:
  push:
    branches: [sonde]
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: quay.io/fedora/fedora-bootc:44
    steps:
      - name: Contenu de fedora-bootc
        run: |
          rpm -qa --qf '%{NAME}\n' | sort > /tmp/base.txt; wc -l < /tmp/base.txt
          for p in rpm-ostree bootupd bootc plymouth NetworkManager NetworkManager-wifi linux-firmware \
                   iwlwifi-mvm-firmware intel-gpu-firmware alsa-sof-firmware firewalld selinux-policy-targeted \
                   systemd-resolved flatpak pipewire wireplumber bluez polkit dracut kernel kernel-modules-extra \
                   cockpit-ws sssd openssh-server podman; do
            grep -qx "$p" /tmp/base.txt && echo "base : $p" || echo "absent : $p"
          done
          echo "== services activés"; systemctl list-unit-files --state=enabled --no-legend | awk '{print $1}' | tr '\n' ' '; echo
      - name: Claviers à l'écran
        run: |
          for p in phosh-osk-stevia phosh-osk-stub stevia maliit-keyboard maliit-framework wvkbd squeekboard onboard \
                   libxkbcommon-tools xkeyboard-config labwc; do
            v=$(dnf -q repoquery --latest-limit 1 --qf '%{VERSION}-%{RELEASE}' "$p" 2>/dev/null | head -1)
            printf '%-24s %s\n' "$p" "${v:-INTROUVABLE}"
          done
          dnf -q repoquery --requires phosh-osk-stevia 2>/dev/null | tr '\n' ' '; echo
          dnf -q repoquery -l phosh-osk-stevia 2>/dev/null | grep -E 'bin/|desktop|systemd' | head
