name: diagnostic
# Lance à la main : lit des informations dans l'image publiée (sans rien modifier)
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - name: Lire l'image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          sudo podman pull -q "$IMAGE" >/dev/null
          sudo podman run --rm "$IMAGE" bash -c '
            cd /usr/share/applications
            for f in $(ls | grep -iE "ptyxis|console|terminal|kgx"); do
              echo "== $f"; grep -E "^(Name|Icon|Exec|StartupWMClass|NoDisplay|DBusActivatable)=" "$f" | head -8
            done
            echo "== binaire"; rpm -q ptyxis gnome-console 2>&1
            strings /usr/bin/ptyxis 2>/dev/null | grep -E "^org\.gnome\.Ptyxis[A-Za-z.]*$" | sort -u | head
            echo "== icônes Smoky"; ls /usr/share/icons/Smoky-icons/apps/256 | grep -iE "ptyxis|terminal" ' > diag.txt 2>&1 || true
          echo "::notice title=Diagnostic::$(sed 's/%/%25/g' diag.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
