name: build-image
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  schedule:
    - cron: '20 4 * * 1'   # chaque lundi : mises à jour de sécurité
  workflow_dispatch:

concurrency:
  group: build-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Construire l'image
        env:
          MOODLE_URL: ${{ vars.MOODLE_URL }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          ARGS=()
          [[ -n "$MOODLE_URL" ]] && ARGS+=(--build-arg "MOODLE_URL=$MOODLE_URL")
          # jusqu'à 3 essais : un téléchargement raté (miroir, registre) ne doit pas tout faire échouer
          for essai in 1 2 3; do
            if sudo podman build --pull=newer "${ARGS[@]}" \
                 --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
                 -t "$IMAGE:latest" -t "$IMAGE:$(date +%Y%m%d)" .; then
              exit 0
            fi
            echo "::warning::Essai $essai échoué, nouvel essai dans 60 s"
            sleep 60
          done
          exit 1

      - name: Publier sur ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push "$IMAGE:latest"
          sudo podman push "$IMAGE:$(date +%Y%m%d)"
